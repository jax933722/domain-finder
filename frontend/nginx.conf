# Serves the built SPA. The top-level reverse proxy (../nginx/nginx.conf)
# routes /api to the backend; this server only serves static assets and
# provides SPA history-fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Cache hashed assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
