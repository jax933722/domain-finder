# Prometheus scrape configuration for Domain Finder.
# Both the API and the worker expose their own /metrics target.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "domain-finder-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "domain-finder-worker"
    static_configs:
      - targets: ["worker:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
